name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。進行中の公開は中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # リポジトリ設定で Pages が未設定でも、ここで有効化する。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # どのコミットが公開されているか画面で分かるようにする。
      # 同じ置換でアセットの URL も変わるので、古い CSS/JS が
      # キャッシュに残って更新が反映されない、という事故も防げる。
      - name: バージョン情報を埋め込む
        run: |
          SHA="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s/__BUILD_SHA__/${SHA}/g" index.html
          sed -i "s|__BUILT_AT__|${BUILT_AT}|g" index.html
          echo "埋め込んだ版: ${SHA} (${BUILT_AT})"
          grep -n 'build-sha\|build-at\|\.css?v=\|\.js?v=' index.html

      # ビルド不要の静的サイトなので、リポジトリ直下をそのまま配信する。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
