name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。進行中の公開は中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # リポジトリ設定で Pages が未設定でも、ここで有効化する。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # ビルド不要の静的サイトなので、リポジトリ直下をそのまま配信する。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
